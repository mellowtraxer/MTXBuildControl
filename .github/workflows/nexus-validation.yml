name: MTX Nexus validation
on:
  push:
    branches: [feature/mtx-nexus]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test registry and routing
        run: python3 -m unittest discover -s nexus/tests -v
      - name: Verify the hosted route for this public repository
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m nexus.runner --trusted-ref feature/mtx-nexus
          --capability android-build --worker nexus-pc-worker.yml
      - name: Check cloud selection
        env:
          TARGET: ${{ steps.route.outputs.target }}
        run: test "$TARGET" = cloud
  android:
    needs: routing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests, lint and development APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MTX-Nexus-development-test-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
