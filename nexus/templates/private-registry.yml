# Install as .github/workflows/nexus-registry.yml in an owner-only private repository.
name: Nexus private project inventory
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: nexus-private-inventory
  cancel-in-progress: false
jobs:
  inventory:
    if: github.event.repository.private && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mellowtraxer/MTXBuildControl
          ref: 17fdf7056252345dd14e27157049ad2bb3ce53b3
          persist-credentials: false
      - name: Obtain a read-only installation token
        id: installation
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NEXUS_DISCOVERY_APP_CLIENT_ID }}
          private-key: ${{ secrets.NEXUS_DISCOVERY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - name: Inventory the installation
        env:
          NEXUS_INSTALLATION_TOKEN: ${{ steps.installation.outputs.token }}
          NEXUS_OWNER: ${{ github.repository_owner }}
        run: python3 -m nexus.registry --owner "$NEXUS_OWNER" --output "$RUNNER_TEMP/inventory.json"
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-private-inventory
          path: ${{ runner.temp }}/inventory.json
          if-no-files-found: error
          retention-days: 7
